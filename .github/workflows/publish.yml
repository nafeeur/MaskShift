name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      # The runner has no D-Bus session bus, which makes Chrome (launched by
      # the browser regression test) stall probing it before it hands back
      # its debugging endpoint. dbus-run-session gives it one to talk to.
      - name: Install dbus
        run: sudo apt-get update && sudo apt-get install -y dbus-x11

      - run: dbus-run-session -- npm run verify

      - name: Check whether this version is already published
        id: version-check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "maskshift@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing (OIDC) needs a recent npm CLI; the one bundled
      # with setup-node's Node 22 predates it.
      - name: Update npm
        if: steps.version-check.outputs.published == 'false'
        run: npm install -g npm@latest

      - name: Publish
        if: steps.version-check.outputs.published == 'false'
        run: npm publish
